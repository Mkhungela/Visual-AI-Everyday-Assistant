<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#08090d" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Show me what you're dealing with. Tell me what you want to do. I'll help you get it done. A camera-first, voice-first, action-oriented AI assistant for everyday life."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Show Me · Visual AI Everyday Assistant</title>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="13" stroke="url(#g)" stroke-width="2.5" />
            <circle cx="16" cy="16" r="4.5" fill="url(#g)" />
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
                <stop stop-color="#ffb347" />
                <stop offset="1" stop-color="#ff5e7e" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <p class="boot-text">Waking up your assistant&hellip;</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #08090d;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .boot-logo {
        width: 64px;
        height: 64px;
        animation: bootpulse 1.6s ease-in-out infinite;
      }
      .boot-text {
        color: #8b8d98;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      @keyframes bootpulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.75;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
  </body>
</html>
